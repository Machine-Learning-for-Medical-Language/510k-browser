[project]
name = "fda510k"
version = "0.1.0"
description = "Data pipeline for 510k-browser: FDA 510(k) clearances and their predicate graph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Bulovic" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "polars>=2.1.0",
]

[project.scripts]
fda510k = "fda510k.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade (modern syntax)
    "SIM", # simplify
    "RUF", # ruff-specific
    "PTH", # prefer pathlib
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.ty.src]
include = ["src", "tests"]
