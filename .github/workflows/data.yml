name: Site data

# Builds the site data from live openFDA metadata plus the committed seed/state files.
# Touches only api.fda.gov / download.open.fda.gov, never accessdata.fda.gov.
on:
  pull_request:
    paths:
      - "src/**"
      - "seed/**"
      - "state/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ingest, build graph, emit site data
        run: uv run fda510k all
      - name: Summarize
        run: |
          {
            echo "## Ingest"; echo '```json'; cat build/ingest_meta.json; echo '```'
            echo "## Graph"; echo '```json'; cat build/graph_report.json; echo '```'
            echo "## Site data"; echo '```'; du -sh build/site-data; ls -lS build/site-data; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: site-data
          path: build/site-data
          retention-days: 7
